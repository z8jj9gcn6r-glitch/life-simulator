<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#6682a3"><title>Life Simulator</title></head><body><header class="top"><h1 id="pageTitle">Главная</h1></header><main id="content" class="wrap"></main><nav id="tabs" class="tabs" aria-label="Разделы"></nav><div id="overlay" class="overlay hidden" role="dialog" aria-modal="true"><section class="dialog"><header id="modalTitle"></header><div id="modalBody"></div></section></div><div id="toast" class="toast hidden" role="status"></div><script src="https://telegram.org/js/telegram-web-app.js"></script><script type="module">
// Stable bootstrap: only version.json changes between releases.
const status = document.getElementById('content');
try {
  const response = await fetch(`./version.json?t=${Date.now()}`, {cache: 'no-store'});
  if (!response.ok) throw new Error(`HTTP ${response.status}`);
  const manifest = await response.json();
  if (!/^v[0-9]+\.[0-9]+\.[0-9]+$/.test(manifest.version)) throw new Error('Invalid release version');
  const base = `./releases/${manifest.version}/`;
  const stylesheet = document.createElement('link');
  stylesheet.rel = 'stylesheet';
  stylesheet.href = `${base}css/style.css`;
  document.head.append(stylesheet);
  await new Promise((resolve, reject) => {
    stylesheet.addEventListener('load', resolve, {once:true});
    stylesheet.addEventListener('error', reject, {once:true});
  });
  await import(`${base}js/app.js`);
} catch (error) {
  console.error('Life Simulator update error:', error);
  status.textContent = 'Не удалось загрузить игру. Проверьте соединение и перезапустите приложение.';
}
</script></body></html>
